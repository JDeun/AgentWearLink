name: BLEDiscovery
options:
  bundleIdPrefix: dev.agentwearlink.research
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  BLEDiscovery:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist]
      - path: Sources/ProbePolicy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agentwearlink.research.blediscovery
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets: []
