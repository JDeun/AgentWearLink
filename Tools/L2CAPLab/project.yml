name: L2CAPLab
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Synthetic BLE L2CAP experiments between your own lab devices only."
targets:
  L2CAPLabPhone:
    type: application
    platform: iOS
    sources:
      - App
      - Sources/LabTransport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agentwearlink.research.l2cap.phone
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets: []
  L2CAPLabMac:
    type: application
    platform: macOS
    sources:
      - App
      - Sources/LabTransport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agentwearlink.research.l2cap.mac
        ENABLE_APP_SANDBOX: NO
    scheme:
      testTargets: []
