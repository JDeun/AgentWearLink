name: AgentWearLinkMetaDATTestHost
options:
  bundleIdPrefix: dev.agentwearlink
  deploymentTarget:
    iOS: "17.2"
packages:
  MetaIntegration:
    path: ..
targets:
  AgentWearLinkMetaDATTestHost:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: MetaIntegration
        product: AgentWearLinkMetaDATIntegration
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agentwearlink.MetaDATTestHost
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  AgentWearLinkMetaDATUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: AgentWearLinkMetaDATTestHost
      - package: MetaIntegration
        product: MWDATMockDeviceTestClient
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AgentWearLinkMetaDATTestHost
