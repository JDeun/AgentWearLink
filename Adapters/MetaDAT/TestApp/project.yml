name: AgentWearLinkMetaDATTestHost
options:
  bundleIdPrefix: dev.agentwearlink
  deploymentTarget:
    iOS: "17.2"
packages:
  AgentWearLink:
    path: ../../..
  MetaIntegration:
    path: ..
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    revision: 1f38beecba83c4c8b5e343540f9cd615323ab19a
targets:
  AgentWearLinkMetaDATIOSHost:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: AgentWearLink
        product: AgentWearLinkCore
      - package: AgentWearLink
        product: AgentWearLinkOpenClaw
      - package: AgentWearLink
        product: AgentWearLinkAppleOutput
      - package: MetaIntegration
        product: AgentWearLinkMetaDATIntegration
      - package: MetaIntegration
        product: AgentWearLinkMetaDATTestSupport
      - package: MetaWearablesDAT
        product: MWDATCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agentwearlink.MetaDATTestHost
        # Local -xcconfig overrides these at physical-device build time.
        # Public CI stays unprovisioned and only runs simulator fixtures.
        AWL_META_APP_ID: "0"
        AWL_META_CLIENT_TOKEN: ""
        AWL_META_TEAM_ID: ""
        AWL_META_CALLBACK_SCHEME: agentwearlink-meta-test
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
    scheme:
      testTargets:
        - AgentWearLinkMetaDATUITests
  AgentWearLinkMetaDATUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: AgentWearLinkMetaDATIOSHost
      - package: MetaWearablesDAT
        product: MWDATMockDeviceTestClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agentwearlink.MetaDATUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AgentWearLinkMetaDATIOSHost
