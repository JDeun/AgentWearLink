name: AgentWearLinkMetaDATTestHost
options:
  bundleIdPrefix: dev.agentwearlink
  deploymentTarget:
    iOS: "17.2"
packages:
  MetaIntegration:
    path: ..
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.0
targets:
  AgentWearLinkMetaDATTestHost:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: MetaIntegration
        product: AgentWearLinkMetaDATIntegration
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agentwearlink.MetaDATTestHost
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  AgentWearLinkMetaDATUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: AgentWearLinkMetaDATTestHost
      - package: MetaWearablesDAT
        product: MWDATMockDeviceTestClient
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AgentWearLinkMetaDATTestHost
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AgentWearLinkMetaDATTestHost.app/AgentWearLinkMetaDATTestHost"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  AgentWearLinkMetaDATTestHost:
    build:
      targets:
        AgentWearLinkMetaDATTestHost: all
        AgentWearLinkMetaDATUITests: [test]
    test:
      targets:
        - name: AgentWearLinkMetaDATUITests
