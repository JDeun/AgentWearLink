name: Swift Core

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Test core package
        run: swift test

  meta-dat-integration:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version
      - name: Resolve pinned Meta DAT SDK
        working-directory: Adapters/MetaDAT
        run: swift package resolve
      - name: List Meta DAT integration schemes
        working-directory: Adapters/MetaDAT
        run: xcodebuild -list
      - name: Compile concrete Meta DAT integration for iOS Simulator
        working-directory: Adapters/MetaDAT
        run: |
          xcodebuild \
            -scheme AgentWearLinkMetaDATIntegration \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            build
      - name: Compile Meta DAT MockDeviceKit test seam
        working-directory: Adapters/MetaDAT
        run: |
          xcodebuild \
            -scheme AgentWearLinkMetaDATIntegration \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            build-for-testing
