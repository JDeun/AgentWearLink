name: Swift Core

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: swift-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Show Swift version
        run: swift --version
      - name: Test core package
        run: swift test

  meta-dat-integration:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version
      - name: Resolve pinned Meta DAT SDK
        working-directory: Adapters/MetaDAT
        run: swift package resolve
      - name: List Meta DAT integration schemes
        working-directory: Adapters/MetaDAT
        run: xcodebuild -list
      - name: Compile concrete Meta DAT integration for iOS Simulator
        working-directory: Adapters/MetaDAT
        run: |
          xcodebuild \
            -scheme AgentWearLinkMetaDATIntegration \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            build
      - name: Compile Meta DAT behavioral test host for iOS Simulator
        working-directory: Adapters/MetaDAT
        run: |
          xcodebuild \
            -scheme AgentWearLinkMetaDATIntegration-Package \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            build
      - name: Run app-hosted MockDeviceKit behavioral contract
        working-directory: Adapters/MetaDAT
        shell: bash
        run: |
          bash Scripts/launch-mock-host.sh
          PORT_FILE="${RUNNER_TEMP}/awl-mwdat-port"
          for _ in {1..30}; do
            [[ -s "$PORT_FILE" ]] && break
            sleep 1
          done
          test -s "$PORT_FILE"
          MWDAT_TEST_SERVER_PORT_FILE="$PORT_FILE" \
            swift test --filter MetaDATMockDeviceUITests
      - name: Explain behavioral test boundary
        run: |
          echo "Meta DAT package target and behavioral host are compile-gated here."
          echo "App-hosted MockDeviceKit pair/state/unpair behavior is exercised on iOS Simulator."
          echo "This is simulator/vendor integration proof, not Bluetooth/background/physical-device proof."
