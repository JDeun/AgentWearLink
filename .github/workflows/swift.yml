name: Swift Core

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: swift-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel obsolete first-attempt runs after a newer commit, but do not let a
  # manual rerun cancel itself inside the same PR concurrency group.
  cancel-in-progress: ${{ github.run_attempt == 1 }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
      meta: ${{ steps.filter.outputs.meta }}
      meta_behavior: ${{ steps.filter.outputs.meta_behavior }}
      meta_host: ${{ steps.filter.outputs.meta_host }}
      meta_ui: ${{ steps.filter.outputs.meta_ui }}
      ios_reference: ${{ steps.filter.outputs.ios_reference }}
      openclaw_contract: ${{ steps.filter.outputs.openclaw_contract }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        id: filter
        with:
          filters: |
            swift:
              - 'Sources/**'
              - 'Tests/**'
              - 'Adapters/**'
              - 'Package.swift'
              - 'Package.resolved'
              - '.github/workflows/swift.yml'
            meta:
              - 'Adapters/MetaDAT/**'
              - 'Sources/AgentWearLinkCore/**'
              - 'scripts/install-xcodegen.sh'
              - 'scripts/verify-meta-dat-revision.sh'
              - 'Package.swift'
              - 'Package.resolved'
              - '.github/workflows/swift.yml'
            meta_behavior:
              - 'Adapters/MetaDAT/**'
              - '.github/workflows/swift.yml'
            meta_host:
              - 'Adapters/MetaDAT/Sources/**'
              - 'Adapters/MetaDAT/TestApp/App/**'
              - 'Adapters/MetaDAT/TestApp/project.yml'
              - 'Adapters/MetaDAT/Package.swift'
              - 'scripts/install-xcodegen.sh'
              - '.github/workflows/swift.yml'
            meta_ui:
              - 'Adapters/MetaDAT/TestApp/**'
              - 'Adapters/MetaDAT/Package.swift'
              - 'scripts/install-xcodegen.sh'
              - '.github/workflows/swift.yml'
            ios_reference:
              - 'Sources/AgentWearLinkCore/**'
              - 'Sources/AgentWearLinkMetaDAT/**'
              - 'Sources/AgentWearLinkOpenClaw/**'
              - 'Sources/AgentWearLinkAppleOutput/**'
              - 'Adapters/MetaDAT/**'
              - 'Package.swift'
              - 'Package.resolved'
              - 'scripts/install-xcodegen.sh'
              - '.github/workflows/swift.yml'
            openclaw_contract:
              - 'Sources/AgentWearLinkOpenClaw/**'
              - 'Tests/AgentWearLinkOpenClawTests/**'
              - 'scripts/verify-openclaw-protocol-contract.py'
              - 'docs/openclaw-protocol-contract.md'

  core-test:
    needs: changes
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Show Swift version
        if: needs.changes.outputs.swift == 'true'
        run: swift --version
      # Each test target runs in its own XCTest process. This isolates Swift
      # concurrency/task lifetime across modules and identifies the responsible
      # suite if a macOS runner ever blocks after a passing test. Keep per-step
      # deadlines smaller than the total job so logs distinguish test stalls.
      - name: Test Core target
        if: needs.changes.outputs.swift == 'true'
        timeout-minutes: 4
        run: swift test --filter AgentWearLinkCoreTests
      # Several Xcode/macOS runners stalled immediately before the OpenClaw
      # protocol JSON decoding fixture while other CI runs passed. Put those
      # synchronous codec cases in a fresh XCTest process, separate from the
      # long-lived actor/transport tests. --skip preserves full class coverage.
      - name: Test OpenClaw protocol codecs in isolation
        if: needs.changes.outputs.swift == 'true'
        timeout-minutes: 2
        run: swift test --filter AgentWearLinkOpenClawTests.OpenClawProtocolTests
      - name: Test remaining OpenClaw cases in isolation
        if: needs.changes.outputs.swift == 'true'
        timeout-minutes: 4
        run: |
          swift test \
            --filter AgentWearLinkOpenClawTests \
            --skip AgentWearLinkOpenClawTests.OpenClawProtocolTests
      - name: Test Meta SDK-neutral target
        if: needs.changes.outputs.swift == 'true'
        timeout-minutes: 3
        run: swift test --filter AgentWearLinkMetaDATTests
      - name: Test Apple output target
        if: needs.changes.outputs.swift == 'true'
        timeout-minutes: 3
        run: swift test --filter AgentWearLinkAppleOutputTests
      - name: Verify pinned OpenClaw protocol contract
        if: needs.changes.outputs.openclaw_contract == 'true'
        run: python3 scripts/verify-openclaw-protocol-contract.py
      - name: Fast-pass non-code changes
        if: needs.changes.outputs.swift != 'true'
        run: echo "No Swift/package/workflow changes; required gate passes without compiling."

  meta-dat-integration:
    needs: changes
    if: needs.changes.outputs.meta == 'true' || needs.changes.outputs.ios_reference == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Show Xcode, Swift, and simulator versions
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes
      - name: Enforce Meta DAT Swift 6 minimum
        shell: bash
        run: |
          set -euo pipefail
          swift_version="$(swift --version | sed -nE 's/.*Swift version ([0-9]+(\.[0-9]+)*).*/\1/p' | head -n 1)"
          if [[ -z "$swift_version" ]]; then
            echo "Unable to determine Swift version from toolchain" >&2
            exit 1
          fi

          swift_major="${swift_version%%.*}"
          if (( swift_major < 6 )); then
            echo "Meta DAT integration requires Swift 6.0+; found Swift $swift_version" >&2
            exit 1
          fi

          echo "Meta DAT Swift toolchain contract satisfied: Swift $swift_version"
      - name: Select available iPhone simulator
        if: needs.changes.outputs.meta_behavior == 'true'
        run: |
          SIMULATOR_UDID="$(xcrun simctl list devices available -j | /usr/bin/python3 -c 'import json,sys; payload=json.load(sys.stdin); print(next(device["udid"] for devices in payload.get("devices", {}).values() for device in devices if device.get("isAvailable", True) and device.get("name", "").startswith("iPhone")))')"
          echo "Using iPhone simulator: ${SIMULATOR_UDID}"
          echo "AWL_IOS_SIMULATOR_UDID=${SIMULATOR_UDID}" >> "$GITHUB_ENV"
      - name: Resolve pinned Meta DAT SDK
        working-directory: Adapters/MetaDAT
        run: swift package resolve
      - name: Verify resolved Meta DAT revision
        run: bash scripts/verify-meta-dat-revision.sh
      - name: List Meta DAT integration schemes
        working-directory: Adapters/MetaDAT
        run: xcodebuild -list
      - name: Compile concrete Meta DAT integration for iOS Simulator
        if: needs.changes.outputs.meta_behavior != 'true'
        working-directory: Adapters/MetaDAT
        run: |
          xcodebuild \
            -scheme AgentWearLinkMetaDATIntegration \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            build
      - name: Verify production Meta target excludes MockDeviceKit
        working-directory: Adapters/MetaDAT
        run: |
          set -euo pipefail
          swift package dump-package > /tmp/awl-meta-package.json
          python3 - <<'PY'
          import json
          with open("/tmp/awl-meta-package.json", "r", encoding="utf-8") as handle:
              package = json.load(handle)
          target = next(t for t in package["targets"] if t["name"] == "AgentWearLinkMetaDATIntegration")
          encoded = json.dumps(target.get("dependencies", []))
          if "MWDATMockDevice" in encoded:
              raise SystemExit("production Meta target unexpectedly depends on MockDeviceKit")
          print("Production Meta target excludes MockDeviceKit.")
          PY
          xcodebuild \
            -scheme AgentWearLinkMetaDATIntegration \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            build
      - name: Build deterministic Meta DAT integration tests
        if: needs.changes.outputs.meta_behavior == 'true'
        timeout-minutes: 8
        working-directory: Adapters/MetaDAT
        run: |
          xcodebuild \
            -scheme AgentWearLinkMetaDATIntegration-Package \
            -destination "platform=iOS Simulator,id=${AWL_IOS_SIMULATOR_UDID}" \
            -skipPackagePluginValidation \
            -parallel-testing-enabled NO \
            -maximum-parallel-testing-workers 1 \
            build-for-testing
      - name: Boot selected iPhone Simulator
        if: needs.changes.outputs.meta_behavior == 'true'
        timeout-minutes: 2
        run: |
          xcrun simctl boot "${AWL_IOS_SIMULATOR_UDID}" 2>/dev/null || true
          for attempt in {1..60}; do
            state="$(xcrun simctl list devices | grep "${AWL_IOS_SIMULATOR_UDID}" || true)"
            if echo "$state" | grep -q "(Booted)"; then
              echo "Simulator reports Booted after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "Simulator did not reach Booted state within 60 seconds" >&2
          xcrun simctl list devices >&2
          exit 1
      - name: Execute deterministic Meta DAT integration tests
        if: needs.changes.outputs.meta_behavior == 'true'
        timeout-minutes: 5
        working-directory: Adapters/MetaDAT
        run: |
          xcodebuild \
            -scheme AgentWearLinkMetaDATIntegration-Package \
            -destination "platform=iOS Simulator,id=${AWL_IOS_SIMULATOR_UDID}" \
            -skipPackagePluginValidation \
            -parallel-testing-enabled NO \
            -maximum-parallel-testing-workers 1 \
            -only-testing:AgentWearLinkMetaDATIntegrationTests \
            test-without-building
      - name: Install pinned XcodeGen
        if: needs.changes.outputs.meta_host == 'true' || needs.changes.outputs.meta_ui == 'true' || needs.changes.outputs.ios_reference == 'true'
        run: |
          bash scripts/install-xcodegen.sh
          echo "$PWD/.build/tools" >> "$GITHUB_PATH"
      - name: Generate full iPhone reference stack host
        if: needs.changes.outputs.meta_host == 'true' || needs.changes.outputs.meta_ui == 'true' || needs.changes.outputs.ios_reference == 'true'
        working-directory: Adapters/MetaDAT/TestApp
        run: |
          xcodegen --version
          xcodegen generate
      - name: Compile full iPhone reference stack host
        if: needs.changes.outputs.meta_host == 'true' || needs.changes.outputs.meta_ui == 'true' || needs.changes.outputs.ios_reference == 'true'
        working-directory: Adapters/MetaDAT/TestApp
        run: |
          xcodebuild -project AgentWearLinkMetaDATTestHost.xcodeproj -scheme AgentWearLinkMetaDATIOSHost -destination 'generic/platform=iOS Simulator' -skipPackagePluginValidation build
      - name: Build MockDeviceKit UI test bundle
        if: needs.changes.outputs.meta_ui == 'true'
        timeout-minutes: 8
        working-directory: Adapters/MetaDAT/TestApp
        run: |
          xcodebuild -project AgentWearLinkMetaDATTestHost.xcodeproj -scheme AgentWearLinkMetaDATIOSHost -destination "platform=iOS Simulator,id=${AWL_IOS_SIMULATOR_UDID}" -skipPackagePluginValidation -parallel-testing-enabled NO -maximum-parallel-testing-workers 1 -disable-concurrent-destination-testing build-for-testing
      - name: Run MockDeviceKit server rendezvous UI test
        if: needs.changes.outputs.meta_ui == 'true'
        # Xcode 26 can spend ~60s tearing down a successful XCUITest session.
        # Keep this bounded while leaving headroom after the in-test deadlines fire.
        timeout-minutes: 5
        working-directory: Adapters/MetaDAT/TestApp
        run: |
          xcodebuild -project AgentWearLinkMetaDATTestHost.xcodeproj -scheme AgentWearLinkMetaDATIOSHost -destination "platform=iOS Simulator,id=${AWL_IOS_SIMULATOR_UDID}" -skipPackagePluginValidation -parallel-testing-enabled NO -maximum-parallel-testing-workers 1 -disable-concurrent-destination-testing test-without-building
      - name: Explain compatibility-only boundary
        if: needs.changes.outputs.meta_behavior != 'true'
        run: |
          echo "This change can affect Meta DAT compilation, so the pinned SDK integration is resolved, revision-verified, and compile-gated."
          echo "No Meta DAT implementation/test path changed, so simulator boot and behavioral XCTest are intentionally skipped."
      - name: Explain behavioral test boundary
        if: needs.changes.outputs.meta_behavior == 'true'
        run: |
          echo "The concrete Meta DAT integration library is compile-gated and its deterministic helper/integration XCTest target is executed on iOS Simulator."
          echo "Behavioral MockDeviceKit pairing remains app-hosted XCUITest evidence (#122); the package test that requires linked-app Keychain context is intentionally skipped."
          echo "No package-hosted mock test is treated as physical-device evidence."

  test:
    needs:
      - changes
      - core-test
      - meta-dat-integration
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require Core and applicable Meta gates
        shell: bash
        env:
          CORE_RESULT: ${{ needs.core-test.result }}
          META_RESULT: ${{ needs.meta-dat-integration.result }}
          META_CHANGED: ${{ needs.changes.outputs.meta }}
          IOS_REFERENCE_CHANGED: ${{ needs.changes.outputs.ios_reference }}
        run: |
          set -euo pipefail

          if [[ "$CORE_RESULT" != "success" ]]; then
            echo "Core gate did not succeed: $CORE_RESULT" >&2
            exit 1
          fi

          meta_required=false
          if [[ "$META_CHANGED" == "true" || "$IOS_REFERENCE_CHANGED" == "true" ]]; then
            meta_required=true
          fi

          if [[ "$meta_required" == "true" && "$META_RESULT" != "success" ]]; then
            echo "Meta DAT gate is required but did not succeed: $META_RESULT" >&2
            exit 1
          fi

          if [[ "$meta_required" != "true" && "$META_RESULT" != "success" && "$META_RESULT" != "skipped" ]]; then
            echo "Unexpected Meta DAT gate result: $META_RESULT" >&2
            exit 1
          fi

          echo "Required merge gate passed."
