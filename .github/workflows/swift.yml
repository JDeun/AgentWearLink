name: Swift Core

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: swift-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Show Swift version
        run: swift --version
      - name: Test core package
        run: swift test

  meta-dat-integration:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version
      - name: Resolve pinned Meta DAT SDK
        working-directory: Adapters/MetaDAT
        run: swift package resolve
      - name: List Meta DAT integration schemes
        working-directory: Adapters/MetaDAT
        run: xcodebuild -list
      - name: Compile concrete Meta DAT integration for iOS Simulator
        working-directory: Adapters/MetaDAT
        run: |
          xcodebuild \
            -scheme AgentWearLinkMetaDATIntegration \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            build
      - name: Compile Meta DAT behavioral test host for iOS Simulator
        working-directory: Adapters/MetaDAT
        run: |
          xcodebuild \
            -scheme AgentWearLinkMetaDATIntegration-Package \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            build
      - name: Generate Meta DAT iOS test host project
        working-directory: Adapters/MetaDAT/TestApp
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Run app-hosted MockDeviceKit UI test
        working-directory: Adapters/MetaDAT/TestApp
        run: |
          xcodebuild \
            -project AgentWearLinkMetaDATTestHost.xcodeproj \
            -scheme AgentWearLinkMetaDATTestHost \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -skipPackagePluginValidation \
            test

      - name: Explain behavioral test boundary
        run: |
          echo "Meta DAT package target is compile-gated and MockDeviceKit runs in a real iOS app/XCUITest host."
          echo "This proves simulator/vendor integration only, not Bluetooth/background/physical-device behavior."
