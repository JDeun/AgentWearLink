name: Swift Core

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: swift-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Show Swift version
        run: swift --version
      - name: Test core package
        run: swift test

  meta-dat-integration:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Show Xcode, Swift, and simulator versions
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes
      - name: Select available iPhone simulator
        run: |
          SIMULATOR_UDID="$(xcrun simctl list devices available -j | /usr/bin/python3 -c 'import json,sys; payload=json.load(sys.stdin); print(next(device["udid"] for devices in payload.get("devices", {}).values() for device in devices if device.get("isAvailable", True) and device.get("name", "").startswith("iPhone")))')"
          echo "Using iPhone simulator: ${SIMULATOR_UDID}"
          echo "AWL_IOS_SIMULATOR_UDID=${SIMULATOR_UDID}" >> "$GITHUB_ENV"
      - name: Resolve pinned Meta DAT SDK
        working-directory: Adapters/MetaDAT
        run: swift package resolve
      - name: List Meta DAT integration schemes
        working-directory: Adapters/MetaDAT
        run: xcodebuild -list
      - name: Compile concrete Meta DAT integration for iOS Simulator
        working-directory: Adapters/MetaDAT
        run: |
          xcodebuild \
            -scheme AgentWearLinkMetaDATIntegration \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            build
      - name: Compile Meta DAT behavioral test host for iOS Simulator
        working-directory: Adapters/MetaDAT
        run: |
          xcodebuild \
            -scheme AgentWearLinkMetaDATIntegration-Package \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            build
      - name: Generate minimal Meta DAT iOS app host
        working-directory: Adapters/MetaDAT/TestApp
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: Compile minimal Meta DAT iOS app host
        working-directory: Adapters/MetaDAT/TestApp
        run: |
          xcodebuild -project AgentWearLinkMetaDATTestHost.xcodeproj -scheme AgentWearLinkMetaDATIOSHost -destination 'generic/platform=iOS Simulator' -skipPackagePluginValidation build
      - name: Boot selected iPhone Simulator
        timeout-minutes: 3
        run: |
          xcrun simctl boot "${AWL_IOS_SIMULATOR_UDID}" 2>/dev/null || true
          xcrun simctl bootstatus "${AWL_IOS_SIMULATOR_UDID}" -b
      - name: Run MockDeviceKit server rendezvous UI test
        timeout-minutes: 2
        working-directory: Adapters/MetaDAT/TestApp
        run: |
          xcodebuild -project AgentWearLinkMetaDATTestHost.xcodeproj -scheme AgentWearLinkMetaDATIOSHost -destination "platform=iOS Simulator,id=${AWL_IOS_SIMULATOR_UDID}" -skipPackagePluginValidation -parallel-testing-enabled NO -maximum-parallel-testing-workers 1 -disable-concurrent-destination-testing test
      - name: Explain behavioral test boundary
        run: |
          echo "Meta DAT package target and behavioral host are compile-gated here."
          echo "Behavioral MockDeviceKit coverage runs in the app-hosted XCUITest harness (#122)."
          echo "Package-hosted xctest is intentionally not used because MWDATCore requires linked-app runtime context."
