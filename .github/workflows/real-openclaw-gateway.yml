name: Real isolated OpenClaw pairing contract

# This is an actual upstream Gateway process, NOT an AWL WebSocket fixture.
# No private tokens, models, Tailnet, Mac mini, or physical glasses are used.
on:
  pull_request:
    paths:
      - '.github/workflows/real-openclaw-gateway.yml'
      - 'scripts/run_hermetic_development_gateway.py'
      - 'scripts/test_run_hermetic_development_gateway.py'
      - 'scripts/dev_gateway_probe_runner.py'
      - 'scripts/run-openclaw-development-gateway.sh'
      - 'Sources/AgentWearLinkOpenClawProbe/**'
      - 'Sources/AgentWearLinkOpenClaw/**'
  workflow_dispatch:

concurrency:
  group: real-gateway-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.run_attempt == 1 }}

permissions:
  contents: read

jobs:
  real-loopback-health:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # Match the explicitly audited upstream protocol-v4 contract pin.
      OPENCLAW_REVISION: 172a5d6202214eea253234c3b04c8184df9fea70
      CI: 'true'
    steps:
      - name: Check out AWL without persisted GitHub credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out exact upstream real Gateway source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: openclaw/openclaw
          ref: 172a5d6202214eea253234c3b04c8184df9fea70
          path: .awl-hermetic-upstream
          persist-credentials: false
      - name: Install supported upstream Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      - name: Verify exact upstream checkout and package toolchain
        shell: bash
        run: |
          test "$(git -C .awl-hermetic-upstream rev-parse HEAD)" = "$OPENCLAW_REVISION"
          node --version
          npm install --global pnpm@12.5.1
          pnpm --version
      - name: Build pinned real CLI Gateway with upstream cliStartup profile
        shell: bash
        timeout-minutes: 28
        run: |
          pnpm --dir .awl-hermetic-upstream install --frozen-lockfile
          # Upstream's official cliStartup profile builds its real gateway
          # runtime and CLI metadata but intentionally omits Control UI.
          # The full UI build enforces a gzip byte budget which is unrelated
          # to the Gateway protocol (first run 37753023021 missed by 81 B).
          (
            cd .awl-hermetic-upstream
            node --import ./scripts/tsx.mjs scripts/build-all.mts cliStartup
          )
          test -f .awl-hermetic-upstream/dist/entry.js
          test -z "$(git -C .awl-hermetic-upstream status --porcelain --untracked-files=no)"
      - name: Compile real AWL production Gateway probe on macOS
        shell: bash
        run: swift build --product awl-openclaw-probe
      - name: Real Gateway refuses unapproved device identity (negative contract)
        id: negative-contract
        shell: bash
        timeout-minutes: 10
        run: |
          python3 -m unittest discover -s scripts -p 'test_run_hermetic_development_gateway.py'
          python3 scripts/run_hermetic_development_gateway.py \
            --checkout .awl-hermetic-upstream \
            --revision "$OPENCLAW_REVISION" \
            --expect-pairing-required
      - name: Real Gateway accepts ephemeral read-only hello and health RPC
        id: positive-health
        shell: bash
        timeout-minutes: 10
        run: |
          python3 scripts/run_hermetic_development_gateway.py \
            --checkout .awl-hermetic-upstream \
            --revision "$OPENCLAW_REVISION" \
            --expect-health-ok
      - name: Evidence boundary
        if: always()
        env:
          NEGATIVE_GATE_OUTCOME: ${{ steps.negative-contract.outcome }}
          POSITIVE_HEALTH_OUTCOME: ${{ steps.positive-health.outcome }}
        run: |
          if [[ "$NEGATIVE_GATE_OUTCOME" == "success" ]]; then
            echo "Negative contract: unapproved read-only identity rejected."
          else
            echo "Negative contract FAILED or was not executed."
          fi
          if [[ "$POSITIVE_HEALTH_OUTCOME" == "success" ]]; then
            echo "Positive contract: disposable localhost identity authenticated with real hello-ok and health RPC."
          else
            echo "Positive hello-ok/health contract FAILED or was not executed."
          fi
          echo "These are NOT operator-approved pairing, Keychain reuse, tokenless reconnect, agent/abort or Tailnet evidence."
