name: Development Gateway harness lint

on:
  push:
    branches: [main]
    paths:
      - 'scripts/dev_gateway_preflight.py'
      - 'scripts/test_dev_gateway_preflight.py'
      - 'scripts/run-openclaw-development-gateway.sh'
      - '.github/workflows/dev-gateway-harness.yml'
  pull_request:
    paths:
      - 'scripts/dev_gateway_preflight.py'
      - 'scripts/test_dev_gateway_preflight.py'
      - 'scripts/run-openclaw-development-gateway.sh'
      - '.github/workflows/dev-gateway-harness.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Python configuration safety tests
        run: python3 -m unittest discover -s scripts -p 'test_dev_gateway_preflight.py'
      - name: Shell syntax
        run: bash -n scripts/run-openclaw-development-gateway.sh
