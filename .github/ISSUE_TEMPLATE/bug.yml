name: Bug report
description: Report a reproducible AgentWearLink defect
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include tokens, private keys, private media, or personal conversation contents.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal deterministic steps. For hardware issues include device, OS, SDK, runtime, and network topology.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: Swift / iOS / macOS / DAT / OpenClaw versions
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized evidence
      description: Logs or traces with credentials and private media removed.
